<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.R. Mattson | Maker Portfolio</title>
<meta name="description" content="Design and fabrication work: CNC, furniture, architectural millwork, and product development.">
<meta property="og:title" content="J.R. Mattson | Maker Portfolio">
<meta property="og:description" content="Design and fabrication work: CNC, furniture, architectural millwork, and product development.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  // Theme before first paint: the visitor's saved choice, else light.
  try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light'; } catch {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F8F9FA; --paper:#FFFFFF; --ink:#111827; --mute:#6B7280; --line:#111827; --gap:12px;
          --sans:'Inter','Helvetica Neue',Arial,sans-serif; --mono:'JetBrains Mono','Roboto Mono',ui-monospace,monospace;
          --backdrop:rgba(17,24,39,.85); color-scheme:light; }
  :root[data-theme="dark"] { --bg:#0B0C0E; --paper:#131519; --ink:#F3F4F6; --mute:#9CA3AF; --line:#D1D5DB;
          --backdrop:rgba(0,0,0,.88); color-scheme:dark; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  body.locked { overflow:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:2px; }

  /* ---------- Filter console ---------- */
  .console { position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--line); padding:16px; }
  .console-head { display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:12px; }
  .console-head h1 { font-size:18px; font-weight:600; letter-spacing:-.01em; }
  .meta { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); }
  .groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px 24px; }
  .group { border-top:1px solid var(--line); padding-top:8px; }
  .group h2 { font-family:var(--mono); font-size:10px; font-weight:500; text-transform:uppercase; letter-spacing:.12em; color:var(--mute); margin-bottom:6px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; line-height:1;
         padding:6px 8px; background:transparent; border:1px solid var(--line); border-radius:0; }
  .tag:hover { background:var(--bg); }
  .tag[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .reset { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; background:none; border:0; padding:0; text-decoration:underline; }
  .reset[hidden] { display:none; }
  .console-head > div { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .console-head .who { gap:4px 14px; }
  .console-head .role { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); }
  .contact { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line); }
  .contact:hover { background:var(--ink); color:var(--paper); }

  /* ---------- Masonry ---------- */
  main { padding:var(--gap); }
  .grid { display:flex; gap:var(--gap); align-items:flex-start; }
  .col { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:var(--gap); }
  .card { position:relative; display:block; width:100%; padding:0; border:1px solid var(--line); background:var(--paper); overflow:hidden; text-align:left; }
  .card img { display:block; width:100%; height:auto; transition:opacity .2s; }
  .card .cap { position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; gap:8px;
               padding:8px 10px; background:var(--paper); border-top:1px solid var(--line);
               font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em;
               transform:translateY(101%); transition:transform .2s; }
  .card .cap span:last-child { color:var(--mute); white-space:nowrap; }
  .card:hover img, .card:focus-visible img { opacity:.7; }
  .card:hover .cap, .card:focus-visible .cap { transform:none; }
  .empty { font-family:var(--mono); font-size:12px; text-transform:uppercase; padding:48px 0; text-align:center; color:var(--mute); }

  /* ---------- Lightbox ---------- */
  dialog.lb { border:0; padding:0; width:100vw; height:100vh; max-width:none; max-height:none; background:transparent; }
  dialog.lb::backdrop { background:var(--backdrop); }
  .lb-box { position:absolute; inset:24px; display:flex; background:var(--paper); border:1px solid var(--line); }
  .lb-img { flex:0 0 70%; display:flex; align-items:center; justify-content:center; background:var(--bg); border-right:1px solid var(--line); padding:16px; min-height:0; }
  .lb-img img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .lb-side { flex:0 0 30%; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; }
  .lb-side h3 { font-size:22px; font-weight:600; letter-spacing:-.01em; line-height:1.2; }
  .lb-side p { font-size:14px; line-height:1.6; }
  .lb-side dl { display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--line); padding-top:16px; }
  .lb-side dd { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .lb-side dd .tag { cursor:default; }
  .lb-close { position:absolute; top:0; right:0; z-index:1; background:var(--paper); border:0; border-left:1px solid var(--line); border-bottom:1px solid var(--line);
              font-family:var(--mono); font-size:12px; padding:8px 12px; }
  .lb-close:hover { background:var(--ink); color:var(--paper); }

  @media (max-width:760px) {
    .console { position:static; } /* too tall to pin on a phone; it scrolls away with the page */
    .lb-box { inset:0; flex-direction:column; border:0; }
    .lb-img { flex:0 0 55%; border-right:0; border-bottom:1px solid var(--line); }
    .lb-side { flex:1 1 auto; }
    .card .cap { transform:none; } /* ponytail: no hover on touch, caption always visible */
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="data.js"></script>
<script>
// portfolioData lives in data.js: run tools/sync.py to add photos, open tools/tag.html to edit.
const items = portfolioData.filter(d => !d.hidden);
// Fisher-Yates: new order every page load, stable while filtering.
for (let i = items.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [items[i], items[j]] = [items[j], items[i]];
}

const GROUPS = [
  ["company", "Company", d => [d.company]],
  ["process", "Process", d => d.tags.process],
  ["material", "Material", d => d.tags.material],
  ["itemType", "Item Type", d => d.tags.itemType],
];
const active = Object.fromEntries(GROUPS.map(([k]) => [k, new Set()]));
const $ = (tag, attrs = {}, ...kids) => { const e = Object.assign(document.createElement(tag), attrs); e.append(...kids); return e; };

// OR within a category, AND across categories.
const matches = d => GROUPS.every(([k, , get]) => !active[k].size || get(d).some(v => active[k].has(v)));

/* ---------- Build DOM ---------- */
const app = document.getElementById('app');
const count = $('span', { className:'meta' });
const reset = $('button', { className:'reset', textContent:'Clear filters', hidden:true });
const groupsEl = $('div', { className:'groups' });
const themeBtn = $('button', { className:'tag', type:'button', textContent:'Dark mode' });
const setTheme = t => { document.documentElement.dataset.theme = t; themeBtn.setAttribute('aria-pressed', t === 'dark'); };
setTheme(document.documentElement.dataset.theme || 'light');
themeBtn.onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  setTheme(t);
  try { localStorage.setItem('theme', t); } catch {}
};
const grid = $('div', { className:'grid' });
const empty = $('p', { className:'empty', textContent:'// No items match the current filter set', hidden:true });

for (const [key, label, get] of GROUPS) {
  const values = [...new Set(items.flatMap(get))].sort();
  if (!values.length) continue; // category not tagged yet
  const tags = $('div', { className:'tags' }, ...values.map(v => {
    const b = $('button', { className:'tag', textContent:v, type:'button' });
    b.setAttribute('aria-pressed', 'false');
    b.dataset.group = key;
    b.onclick = () => {
      active[key].has(v) ? active[key].delete(v) : active[key].add(v);
      b.setAttribute('aria-pressed', active[key].has(v));
      layout();
    };
    return b;
  }));
  groupsEl.append($('section', { className:'group' }, $('h2', { textContent:label }), tags));
}
reset.onclick = () => {
  Object.values(active).forEach(s => s.clear());
  groupsEl.querySelectorAll('.tag').forEach(b => b.setAttribute('aria-pressed', 'false'));
  layout();
};

app.append(
  $('header', { className:'console' },
    $('div', { className:'console-head' },
      $('div', { className:'who' },
        $('h1', { textContent:'J.R. Mattson' }),
        $('span', { className:'role', textContent:'Design + Fabrication' }),
        $('a', { className:'contact', href:'mailto:james.mattson@gmail.com', textContent:'Email' }),
        $('a', { className:'contact', href:'https://www.linkedin.com/in/j-r-mattson-95495b193/', target:'_blank', rel:'noopener', textContent:'LinkedIn' })),
      $('div', {}, count, reset, themeBtn)),
    groupsEl),
  $('main', {}, grid, empty),
);

// Cards are built once and re-parented on each layout, so images never reload.
const cards = new Map(items.map(d => {
  // Grid uses the 800px thumb; w/h from data.js reserve space so lazy loading never reshuffles columns.
  const img = $('img', { loading:'lazy', decoding:'async', width:d.w, height:d.h, alt:d.title, src:d.imageSrc.replace('/full/', '/thumb/') }); // loading must be set before src
  const card = $('button', { className:'card', type:'button' },
    img, $('div', { className:'cap' }, $('span', { textContent:d.title }), $('span', { textContent:d.company })));
  card.onclick = () => openLightbox(d);
  return [d.id, card];
}));

/* ---------- Masonry: greedy shortest-column, in shuffled order ---------- */
const colCount = () => { const w = innerWidth; return w < 560 ? 1 : w < 900 ? 2 : w < 1400 ? 3 : 4; };

function layout() {
  const shown = items.filter(matches);
  const n = colCount();
  const cols = Array.from({ length:n }, () => $('div', { className:'col' }));
  const heights = new Array(n).fill(0);
  for (const d of shown) {
    const i = heights.indexOf(Math.min(...heights));
    cols[i].append(cards.get(d.id));
    heights[i] += d.h / d.w + 0.02;
  }
  grid.replaceChildren(...cols);
  empty.hidden = shown.length > 0;
  count.textContent = `${String(shown.length).padStart(2, '0')} / ${String(items.length).padStart(2, '0')} items`;
  reset.hidden = !Object.values(active).some(s => s.size);
}
let raf = 0;
const scheduleLayout = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); };
let lastCols = colCount();
addEventListener('resize', () => { if (colCount() !== lastCols) { lastCols = colCount(); scheduleLayout(); } });

/* ---------- Lightbox (native <dialog>: focus trap + Esc for free) ---------- */
const lbImg = $('img');
const lbSide = $('div', { className:'lb-side' });
const closeBtn = $('button', { className:'lb-close', type:'button', textContent:'[ X ]', ariaLabel:'Close' });
const lb = $('dialog', { className:'lb' }, $('div', { className:'lb-box' }, closeBtn, $('div', { className:'lb-img' }, lbImg), lbSide));
document.body.append(lb);

function openLightbox(d) {
  lbImg.src = d.imageSrc; lbImg.alt = d.title;
  const tagList = GROUPS.slice(1).filter(([k]) => d.tags[k].length).map(([k, label]) =>
    $('div', {}, $('dt', { className:'meta', textContent:label }),
      $('dd', {}, ...d.tags[k].map(v => $('span', { className:'tag', textContent:v })))));
  lbSide.replaceChildren(
    $('span', { className:'meta', textContent:`${d.id} // ${d.company}` }),
    $('h3', { textContent:d.title }),
    ...(d.description ? [$('p', { textContent:d.description })] : []),
    $('dl', {}, ...tagList));
  lbSide.scrollTop = 0;
  document.body.classList.add('locked');
  lb.showModal();
  closeBtn.focus();
}
closeBtn.onclick = () => lb.close();
lb.addEventListener('click', e => { if (e.target === lb) lb.close(); }); // backdrop / outside the box
lb.addEventListener('close', () => document.body.classList.remove('locked'));

layout();
</script>
</body>
</html>
